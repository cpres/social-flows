<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footage Studio</title>
    <script>
      // Apply the saved theme before the page draws (no flash of the light theme at night).
      try {
        var t = localStorage.getItem('footage-studio-theme')
        if (!t && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'
        if (t) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23344a34'/><path d='M12 9l11 7-11 7z' fill='%23f7f1e3'/></svg>" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
