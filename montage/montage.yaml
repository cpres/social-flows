# Steward montage config. File paths are relative to this file.
# Times can be seconds (75) or m:ss (1:15).

output: renders/tool-care-week.mp4
rounds: 3                 # passes through the clips

# ---- Sound -------------------------------------------------------------
music: music/track.mp3    # remove this line to use only the glasses audio
music_start: 0:00         # start the song partway in
music_volume: 1.0
music_fade_out: 2.0       # seconds of fade at the end

original_audio: true      # keep glasses audio (birds, shovel, water)...
original_volume: 0.35     # ...quietly under the music

beat_sync: true           # cuts land on the music's beats
beats_per_cut: 2          # 2 beats per cut at ~100bpm is about 1.2s
# bpm: 96                 # set this if librosa isn't installed

# Used when beat_sync is off or there's no music:
clip_length: 1.5
image_hold: 2.5

# ---- Transitions -------------------------------------------------------
# cut | dissolve | dip (through black) | dip_white
transitions:
  within_round: cut       # snappy inside a round
  between_rounds: dissolve  # soft breath as time passes
  into_image: dissolve
  out_of_image: dissolve
  duration: 0.35

photo_motion: push        # slow push-in on photos (or: none)
photo_zoom: 0.06          # how far it pushes; 0.04–0.08 stays subtle

# ---- Framing -----------------------------------------------------------
fit: fill                 # fill = crop to 9:16 | blur | pad (brand color)

# ---- Clips -------------------------------------------------------------
sources:
  - id: mulch
    file: footage/mulching.mp4
    start: 0:15           # first cut here...
    step: 0:30            # ...then jump forward this much each round

  - id: shovel
    file: footage/sharpening.mp4
    start: 1:00
    step: 0:20
    beats: 4              # this clip holds longer (length: 3 when not beat-synced)

  - id: verge
    file: footage/verge.mp4
    times: [0:20, 0:55, 1:30]   # or pick each round's moment by hand

  - id: finished
    file: photos/finished-verge.jpg
    in_round: last        # first | last | all | 2 | [1, 3]
    hold_beats: 6         # (hold: 3 when not beat-synced)
